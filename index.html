<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon : le papillon officiel (crème sur fond bordeaux), jamais la lettre E.
         favicon.ico (16, 32, 48 px) pour les navigateurs, les favoris et les moteurs de
         recherche (Google demande un multiple de 48 px) ; PNG 32 et 16 px pour les onglets.
         « ?v=2 » force les navigateurs à abandonner l'ancienne icône en cache.
         admin.ezial.net remplace ces adresses par celles de son icône (src/lib/pwaIdentity.ts). -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=2" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=2" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ezial — Mode, beauté & lifestyle à Dakar</title>
    <meta name="description" content="Ezial est une marketplace qui réunit des boutiques de mode, beauté, cheveux, bijoux et parfums à Dakar, avec livraison ou retrait en boutique." />
    <link rel="canonical" href="https://ezial.net/" />
    <!-- Application web installable (iPhone, Android) : manifeste « standalone » et
         icône officielle. iPhone / iPad : apple-touch-icon 180 px et balises
         apple-mobile-web-app-* ; Android : manifeste (192, 512 et adaptative).
         Aucune fenêtre d'installation n'est imposée par le site. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ezial" />
    <meta name="application-name" content="Ezial" />
    <meta name="theme-color" content="#5A0D1E" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ezial" />
    <meta property="og:title" content="Ezial — Mode, beauté & lifestyle à Dakar" />
    <meta property="og:description" content="Découvrez des boutiques de mode, beauté, cheveux, bijoux et parfums à Dakar, avec livraison ou retrait en boutique." />
    <meta property="og:url" content="https://ezial.net/" />
    <meta property="og:image" content="https://ezial.net/ezial-fallback.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ezial.net/ezial-fallback.webp" />
  </head>
  <body class="bg-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
