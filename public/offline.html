<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#5A0D1E" />
  <title>Hors connexion — Ezial</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: #F8F3EE; color: #1f1a1b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 380px; text-align: center; }
    .logo { margin: 0 0 20px; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-size: 30px; letter-spacing: 0.12em; color: #5A0D1E; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; color: #5A0D1E; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #5c5355; }
    a { display: inline-block; padding: 12px 28px; border-radius: 999px; background: #5A0D1E; color: #fff; text-decoration: none; font-size: 15px; font-weight: 500; }
    a:active { background: #8C1024; }
  </style>
</head>
<body>
  <main>
    <p class="logo">EZIAL</p>
    <h1>Vous êtes hors connexion</h1>
    <p>Ezial a besoin d’Internet pour afficher les boutiques, votre panier et vos commandes. Vérifiez votre connexion, puis réessayez.</p>
    <a href="">Réessayer</a>
  </main>
</body>
</html>
