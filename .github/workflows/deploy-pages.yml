name: Deploy to GitHub Pages

# www.ezial.net is now served by Cloudflare Pages (its own build pipeline,
# configured directly in the Cloudflare dashboard — not in this repo),
# which replaced this workflow as the live deploy target. Kept here,
# manual-dispatch-only, as a rollback path — it still produces a correct,
# fully working build (same `npm run build`, same prerendered SEO pages)
# if ever needed again — but no longer runs automatically, so it can't
# publish a second, competing deploy of the same custom domain alongside
# Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` now runs `vite build && node scripts/prerender-seo.mjs`
      # in one step (package.json) — the exact same command Cloudflare Pages
      # runs for the live deploy — so both SEO pages + sitemap.xml come out
      # of this single step instead of a separate one after it. A failure
      # anywhere in that chain fails the whole deploy rather than publish a
      # dist missing every SEO page (GitHub Pages only updates on a
      # successful job, so the previous deploy stays live instead).
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
