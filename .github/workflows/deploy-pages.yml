name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The SEO pages + sitemap (scripts/prerender-seo.mjs) are only ever
  # (re)generated by this same workflow — without a schedule they'd stay
  # frozen at whatever the catalog looked like on the last code push, so a
  # product/boutique added days later would simply have no indexable page
  # and no sitemap entry until the next unrelated deploy. Once a day is
  # enough for a catalog that doesn't change by the minute.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      # Generates the real, static, crawlable product/boutique/categorie
      # pages + sitemap.xml straight from the current Supabase catalog (see
      # scripts/prerender-seo.mjs) — runs after the build so it can reuse
      # dist/index.html's own hashed asset tags, and before the upload so
      # those generated files are included in the deployed artifact. A
      # failure here must fail the whole deploy rather than publish a dist
      # missing every SEO page (GitHub Pages only updates on a successful
      # job, so the previous deploy stays live instead).
      - name: Generate SEO pages + sitemap
        run: node scripts/prerender-seo.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Generates the real, static, crawlable product/boutique/categorie
      # pages + sitemap.xml straight from the current Supabase catalog (see
      # scripts/prerender-seo.mjs) — runs after the build so it can reuse
      # dist/index.html's own hashed asset tags, and before the upload so
      # those generated files are included in the deployed artifact. A
      # failure here must fail the whole deploy rather than publish a dist
      # missing every SEO page (GitHub Pages only updates on a successful
      # job, so the previous deploy stays live instead).
      - name: Generate SEO pages + sitemap
        run: node scripts/prerender-seo.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
